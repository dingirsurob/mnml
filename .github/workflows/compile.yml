name: Compilar APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 8 (Entorno Nativo)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Sabotear el servidor muerto de Fabric en el sistema
        run: |
          # Redirigir el tráfico de maven.fabric.io a la ip local (offline) para que de error inmediato sin trabar el build
          sudo echo "127.0.0.1 maven.fabric.io" | sudo tee -a /etc/hosts
          
          # Eliminar variables globales de gradle antiguas que puedan estar guardadas en la máquina virtual
          rm -rf ~/.gradle/gradle.properties || true
          rm -rf ~/.gradle/init.gradle || true

      - name: Instalar Gradle Limpio del Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle
          
      - name: Reconstruir y forzar Wrapper moderno compatible
        run: |
          rm -f gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          gradle wrapper --gradle-version 6.9.4
          chmod +x gradlew

      - name: Destrucción Masiva de Fabric en Archivos Locales
          # Borrar cualquier rastro residual en configuraciones del subproyecto
        run: |
          find . -name "*.gradle" -type f -exec sed -i '/fabric/d' {} +
          find . -name "*.gradle" -type f -exec sed -i '/Fabric/d' {} +
          
          cat << 'EOF' > build.gradle
          buildscript {
              ext.kotlin_version = '1.3.50'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:3.5.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }

          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

      - name: Aceptar licencias del SDK de Android
        run: |
          mkdir -p ${ANDROID_HOME}/licenses
          echo -e "\n893a5cd8e1c6392d9c74d8e74d3752e9fc534316\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > ${ANDROID_HOME}/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > ${ANDROID_HOME}/licenses/android-sdk-preview-license

      - name: Ejecutar Compilación Aislada
        run: ./gradlew assembleDebug --no-daemon --offline || ./gradlew assembleDebug --no-daemon --stacktrace
        
