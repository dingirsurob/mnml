name: Compilar APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 8 (Entorno Nativo)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Instalar Gradle Limpio del Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle
          
      - name: Reconstruir y forzar Wrapper moderno compatible
        run: |
          rm -f gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          gradle wrapper --gradle-version 6.9.4
          chmod +x gradlew

      - name: Extirpar servidores muertos de Fabric
        run: |
          # Eliminar la línea del repositorio de Fabric que da error 403
          sed -i '/maven { url '\''https:\/\/maven.fabric.io\/public'\'' }/d' build.gradle
          
          # Eliminar la dependencia del plugin de Fabric obsoleta
          sed -i '/classpath '\''io.fabric.tools:gradle:/d' build.gradle
          
          # Eliminar la aplicación del plugin en el archivo del módulo de la app
          sed -i '/apply plugin: '\''io.fabric'\''/d' app/build.gradle
          
          # Asegurar que se busquen las dependencias en repositorios vivos de Google y MavenCentral
          sed -i 's/jcenter()/mavenCentral()/g' build.gradle

      - name: Aceptar licencias del SDK de Android
        run: |
          mkdir -p ${ANDROID_HOME}/licenses
          echo -e "\n893a5cd8e1c6392d9c74d8e74d3752e9fc534316\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > ${ANDROID_HOME}/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > ${ANDROID_HOME}/licenses/android-sdk-preview-license

      - name: Ejecutar Compilación Forzada
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        
